[workspace]
resolver = "2"
members = ["core", "native", "wasm"]
# `wasm` is a member, so fmt and clippy see it, and not a default one: a cdylib
# built for the host hits a MinGW linker fault, so it is built for wasm32 alone
default-members = ["core", "native"]

# The solver is memory-bound at its hottest, so what matters here is that LLVM
# can see across the whole core rather than that it unrolls harder.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# the browser downloads the WASM build, so size outranks the last few percent of
# speed; a profile in wasm/Cargo.toml would be ignored, profiles count at the root
[profile.release.package.wordle_wasm]
opt-level = "s"

# no fast-math equivalent anywhere: letting the compiler reassociate the bucket
# reduction reorders a store ahead of a load (README *Keeping the port in step*)
